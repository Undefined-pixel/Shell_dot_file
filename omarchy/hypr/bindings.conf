# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm-app -- xdg-terminal-exec
$browser = firefox

bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
#bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password
#bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
#bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm-app -- signal-desktop"

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT, P, Bitwarden, exec, flatpak run com.bitwarden.desktop
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"
#bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
#bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
#bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
#bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
#bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
#bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
#unbind = SUPER, SPACE
# bindd = SUPER, ALT, Omarchy menu, exec, omarchy-menu

# own settings

#unbind 

#super copy
unbind = SUPER, V
# key bindings 
unbind = SUPER, K 

#bindd = SUPER, L, Toggle workspace layout, exec, omarchy-hyprland-workspace-layout-toggle
unbind = SUPER, L 
bindd = SUPER SHIFT, L, Toggle workspace layout, exec, omarchy-hyprland-workspace-layout-toggle


#bindd = SUPER, J, Toggle window split, layoutmsg, togglesplit
unbind = SUPER, J  
bindd = SUPER, V, Toggle window split, layoutmsg, togglesplit

# Swap active window with the one next to it with SUPER + SHIFT + arrow keys
#bindd = SUPER SHIFT, LEFT, Swap window to the left, swapwindow, l
#bindd = SUPER SHIFT, RIGHT, Swap window to the right, swapwindow, r
#bindd = SUPER SHIFT, UP, Swap window up, swapwindow, u
#bindd = SUPER SHIFT, DOWN, Swap window down, swapwindow, d

unbind = SUPER SHIFT, LEFT
unbind = SUPER SHIFT, RIGHT
unbind = SUPER SHIFT, UP
unbind = SUPER SHIFT, DOWN

#bindd = SUPER H, Swap window to the left, swapwindow, l
#bindd = SUPER L, RIGHT, Swap window to the right, swapwindow, r
#bindd = SUPER K, Swap window up, swapwindow, u
#bindd = SUPER J, Swap window down, swapwindow, d

bind = SUPER,H, swapwindow, l
bind = SUPER,L, swapwindow, r
bind = SUPER,K, swapwindow, u
bind = SUPER,J, swapwindow, d

#bindd = SUPER, code:20, Expand window left, resizeactive, -100 0    # - key
#bindd = SUPER, code:21, Shrink window left, resizeactive, 100 0     # = key
#bindd = SUPER SHIFT, code:20, Shrink window up, resizeactive, 0 -100
#bindd = SUPER SHIFT, code:21, Expand window down, resizeactive, 0 100

unbind = SUPER, code:20 
unbind = SUPER, code:21
unbind = SUPER SHIFT, code:20 
unbind = SUPER SHIFT, code:21 

bindd = SUPER_SHIFT, LEFT, Expand window left, resizeactive, -100 0
bindd = SUPER_SHIFT, RIGHT, Shrink window right, resizeactive, 100 0
bindd = SUPER_SHIFT, UP, Shrink window up, resizeactive, 0 -100
bindd = SUPER_SHIFT, DOWN, Expand window down, resizeactive, 0 100


# Kill window 
unbind = SUPER, W
bindd = SUPER, Q, Close window, killactive,

bindd = SUPER SHIFT, V, Toggle window split, togglesplit, # dwindle

unbind = SUPER, D
bindd = SUPER, D, Omarchy menu, exec, omarchy-launch-walker




